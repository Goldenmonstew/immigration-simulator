name: Deploy to GitHub Pages

# A second copy of the site at https://<owner>.github.io/<repo>/, for networks
# where pages.dev or the custom domain do not open. Built after CI passes on
# main, with the repository name as the base path.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: github-pages

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_PATH: /${{ github.event.repository.name }}
      # A re-run of CI for a commit from before the base path support would
      # publish root-path pages; refuse to publish those.
      - name: Check the base path
        run: grep -q '/${{ github.event.repository.name }}/_next/' apps/web/out/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  # A separate job: deploy-pages in the same job as the upload can miss the
  # just-finalised artifact ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
