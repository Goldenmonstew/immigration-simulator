name: Deploy to Cloudflare Pages

# After CI (unit tests and browser regression) passes on main:
# build once → deploy to staging → smoke-test staging → deploy production →
# record a GitHub release listing the commits that went live.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to staging
        run: pnpm dlx wrangler@4.157.0 pages deploy apps/web/out --project-name "$CF_PAGES_PROJECT" --branch staging --commit-hash "$SHA"
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Smoke-test staging
        run: pnpm e2e --grep @smoke
        env:
          E2E_BASE_URL: https://staging.${{ vars.CF_PAGES_PROJECT }}.pages.dev

      - name: Deploy to production
        run: pnpm dlx wrangler@4.157.0 pages deploy apps/web/out --project-name "$CF_PAGES_PROJECT" --branch main --commit-hash "$SHA"

      - name: Record release
        run: |
          previous=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          tag="deploy-$(date -u +%Y%m%d-%H%M)-${SHA:0:7}"
          if [ -n "$previous" ]; then range="$previous..$SHA"; else range="$SHA~20..$SHA"; fi
          git log --no-merges --format='- %s (%h)' "$range" > notes.md
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md
